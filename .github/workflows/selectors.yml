name: Selector check

# Verifie chaque semaine que les selecteurs XPath trouvent encore ce qu'ils visent sur
# xivmodarchive.
#
# C'est la seule panne qui ne se signale pas. Le code ne leve pas quand un selecteur ne trouve
# rien : il retombe sur une valeur de repli, journalise un avertissement que personne ne lit, et
# affiche une grille de mods tous intitules "Untitled". Le depot d'origine est mort ainsi, ses
# XPath ayant vieilli sans que rien ne le dise.
#
# Ce controle est separe de la CI ordinaire a dessein : il depend d'un site tiers, donc il echoue
# parfois sans qu'aucune ligne de ce depot soit en cause. Le meler aux tests de chaque commit
# apprendrait a ignorer les echecs.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  selectors:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:GITHUB_WORKSPACE\dalamud"
          "DALAMUD_HOME=$env:GITHUB_WORKSPACE\dalamud" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check the selectors against the live site
        id: check
        run: dotnet test ModArchiveBrowser.Tests/ModArchiveBrowser.Tests.csproj --nologo --filter "Category=Live"

      # Une execution planifiee n'est regardee par personne : sans ticket, l'echec resterait dans
      # l'onglet Actions jusqu'a ce qu'un utilisateur signale que tous ses mods s'appellent
      # "Untitled".
      - name: Open an issue if they broke
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $title = 'Selectors no longer match xivmodarchive'

          # Recherche par titre plutot que par etiquette : une etiquette absente du depot fait
          # echouer la commande, et on ne veut pas d'un ticket par semaine tant que le premier
          # n'est pas traite.
          $open = gh issue list --state open --search $title --json number --jq 'length'
          if ($open -ne '0') {
            Write-Host 'An open selector issue already exists; not filing another.'
            exit 0
          }

          # Un tableau de lignes plutot qu'un here-string : le terminateur d'un here-string
          # PowerShell doit commencer en colonne zero, ce que l'indentation d'un bloc YAML rend
          # impossible.
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @(
            'The weekly selector check failed: one or more XPath selectors no longer find what they target on xivmodarchive.',
            '',
            'This does not crash the plugin. Parsing falls back to placeholder values, so the symptom in game is mods named "Untitled", missing authors, or blank thumbnails.',
            '',
            "Run: $run",
            '',
            'To reproduce and fix:',
            '',
            '1. `dotnet test ModArchiveBrowser.Tests/ModArchiveBrowser.Tests.csproj --filter "Category=Live"` names the failing field.',
            '2. Fetch the page it reads and find the new markup.',
            '3. Update the selector in `WebClient.cs`, then refresh the saved pages under `ModArchiveBrowser.Tests/Fixtures/` so the offline suite matches the site again.'
          ) -join "`n"

          $body | Set-Content -Path issue.md -Encoding utf8
          gh issue create --title $title --body-file issue.md
