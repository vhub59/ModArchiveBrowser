name: Release

# Se declenche sur un tag de version, et sur lui seul.
#
# L'ancien workflow utilisait "tags-ignore: testing_*", ce qui le faisait partir sur n'importe quel
# autre tag : un simple tag de travail suffisait a publier une release. On nomme explicitement ce
# qui declenche plutot que ce qui ne declenche pas.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # Le tag porte un "v" que MSBuild refuse dans un numero de version.
      #
      # Dalamud compare la version annoncee par repo.json a celle du manifeste embarque, et exige
      # une egalite stricte, chaine a chaine. Or le SDK normalise en quatre segments : un tag
      # v0.8.0 produit un manifeste en 0.8.0.0, et l'installation echoue sur
      # "Distributed plugin version does not match repo version". On calcule donc les deux formes.
      #
      # ToString(4) ne convient pas pour completer : [version]"0.8.1" n'a que trois segments, sa
      # revision vaut -1, et la methode refuse alors de la formater. On assemble a la main, en
      # ramenant a zero les segments absents.
      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $parsed = [version]$version
          $full = '{0}.{1}.{2}.{3}' -f $parsed.Major, $parsed.Minor,
                                       [Math]::Max($parsed.Build, 0),
                                       [Math]::Max($parsed.Revision, 0)
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "full=$full"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building $version, published as $full"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Dalamud.NET.Sdk a besoin des bibliotheques de Dalamud pour compiler. DALAMUD_HOME lui dit ou
      # les trouver, ce qui evite de dependre d'un chemin dans le profil utilisateur du runner.
      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:GITHUB_WORKSPACE\dalamud"
          "DALAMUD_HOME=$env:GITHUB_WORKSPACE\dalamud" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: |
          dotnet build ModArchiveBrowser/ModArchiveBrowser.csproj `
            --configuration Release --nologo `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:AssemblyVersion=${{ steps.version.outputs.value }} `
            -p:FileVersion=${{ steps.version.outputs.value }}

      # Dalamud.NET.Sdk produit deja une archive prete a installer. L'ancien workflow zippait
      # bin/Release/* et obtenait une arborescence differente de celle qu'attend Dalamud.
      - name: Collect package
        shell: pwsh
        run: |
          $package = 'ModArchiveBrowser/bin/Release/ModArchiveBrowser/latest.zip'
          if (-not (Test-Path $package)) { throw "Package not found at $package" }
          Copy-Item $package ModArchiveBrowser.zip

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' ModArchiveBrowser.zip `
            --title 'ModArchiveBrowser ${{ github.ref_name }}' `
            --generate-notes

      # repo.json est le fichier que les utilisateurs collent dans Dalamud : il doit pointer vers la
      # release qui vient d'etre publiee, sans quoi ils installeraient la precedente.
      - name: Point repo.json at the new release
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $tag = '${{ github.ref_name }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/ModArchiveBrowser.zip"

          $json = Get-Content -Raw repo.json | ConvertFrom-Json
          $json[0].AssemblyVersion = '${{ steps.version.outputs.full }}'
          $json[0].DownloadLinkInstall = $url
          $json[0].DownloadLinkUpdate = $url
          $json[0].DownloadLinkTesting = $url

          $json | ConvertTo-Json -AsArray -Depth 10 | Set-Content -Path repo.json

      - name: Commit repo.json
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add repo.json
          # Rien a commiter si la release est rejouee sur le meme tag.
          git diff --staged --quiet; if ($LASTEXITCODE -ne 0) {
            git commit -m "Point repo.json at ${{ github.ref_name }}"
            git push origin HEAD:master
          }
